<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pay Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <style>
        .payment-method-section {
            display: none;
        }
        .payment-method-section.active {
            display: block;
        }
    </style>
</head>
<body>

<div class="container my-4">
    <h2 class="mb-4">Pay Order</h2>

    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h5>Order Details</h5>
        </div>
        <div class="card-body">
            <p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
            <p><strong>Customer:</strong> <span th:text="${order.author}"></span></p>
            <p><strong>Order Time:</strong> <span th:text="${#dates.format(new java.util.Date(order.orderTime * 1000), 'yyyy-MM-dd HH:mm:ss')}"></span></p>
            <p><strong>Status:</strong> <span th:text="${order.status}"></span></p>
            <p><strong>Products:</strong></p>
            <ul>
                <li th:each="product : ${order.products}">
                    <span th:text="${product.productName}"></span> 
                    (Quantity: <span th:text="${product.productQuantity}"></span>)
                </li>
            </ul>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5>Payment Information</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/order/pay/{orderId}(orderId=${order.id})}" method="post">
                <div class="form-group">
                    <label for="paymentMethodSelect">Select Payment Method</label>
                    <select class="form-control col-6" id="paymentMethodSelect" name="paymentMethod" required>
                        <option value="">-- Select Payment Method --</option>
                        <option value="VOUCHER">Voucher</option>
                        <option value="CASH_ON_DELIVERY">Cash on Delivery</option>
                    </select>
                </div>

                <!-- Voucher Payment Section -->
                <div id="voucherSection" class="payment-method-section">
                    <div class="form-group">
                        <label for="voucherCodeInput">Voucher Code</label>
                        <input type="text" class="form-control col-6" id="voucherCodeInput" name="voucherCode" 
                               placeholder="Enter voucher code (e.g., ESHOP1234ABC5678)">
                        <small class="form-text text-muted">
                            Voucher code must be 16 characters, start with "ESHOP", and contain 8 digits.
                        </small>
                    </div>
                </div>

                <!-- Cash on Delivery Payment Section -->
                <div id="codSection" class="payment-method-section">
                    <div class="form-group">
                        <label for="addressInput">Delivery Address</label>
                        <textarea class="form-control col-6" id="addressInput" name="address" rows="3" 
                                  placeholder="Enter delivery address"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="deliveryFeeInput">Delivery Fee</label>
                        <input type="number" class="form-control col-6" id="deliveryFeeInput" name="deliveryFee" 
                               placeholder="Enter delivery fee">
                    </div>
                </div>

                <button type="submit" class="btn btn-success">Process Payment</button>
                <a th:href="@{/order/history?author={author}(author=${order.author})}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" 
        crossorigin="anonymous">
</script>
<script>
    document.getElementById('paymentMethodSelect').addEventListener('change', function() {
        var voucherSection = document.getElementById('voucherSection');
        var codSection = document.getElementById('codSection');
        
        // Hide all sections
        voucherSection.classList.remove('active');
        codSection.classList.remove('active');
        
        // Show selected section
        if (this.value === 'VOUCHER') {
            voucherSection.classList.add('active');
        } else if (this.value === 'CASH_ON_DELIVERY') {
            codSection.classList.add('active');
        }
    });
</script>

</body>
</html>
