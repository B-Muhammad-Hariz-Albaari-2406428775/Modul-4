<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Order</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>

<div class="container my-4">
    <h2 class="mb-4">Create New Order</h2>

    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/order/create}" method="post">
        <div class="form-group">
            <label for="authorInput">Your Name</label>
            <input type="text" class="form-control mb-4 col-6" id="authorInput" name="author" 
                   th:value="${author}" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Select Products</label>
            <div th:if="${products.isEmpty()}" class="alert alert-warning">
                No products available. Please create products first.
            </div>
            <div th:unless="${products.isEmpty()}">
                <div th:each="product : ${products}" class="form-check">
                    <input class="form-check-input" type="checkbox" name="productIds" 
                           th:value="${product.productId}" th:id="'product-' + ${product.productId}">
                    <label class="form-check-label" th:for="'product-' + ${product.productId}">
                        <span th:text="${product.productName}"></span> 
                        (Quantity: <span th:text="${product.productQuantity}"></span>)
                    </label>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" th:disabled="${products.isEmpty()}">Create Order</button>
        <a th:href="@{/order/history}" class="btn btn-secondary">View Order History</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" 
        crossorigin="anonymous">
</script>

</body>
</html>
