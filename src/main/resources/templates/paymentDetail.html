<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Details</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>

<div class="container my-4">
    <h2 class="mb-4">Payment Details</h2>

    <div class="card mb-4">
        <div class="card-header">
            <h5>Payment Information</h5>
        </div>
        <div class="card-body">
            <p><strong>Payment ID:</strong> <span th:text="${payment.id}"></span></p>
            <p><strong>Payment Method:</strong> <span th:text="${payment.method}"></span></p>
            <p><strong>Payment Status:</strong> 
                <span th:if="${payment.status == 'SUCCESS'}" class="badge badge-success" th:text="${payment.status}"></span>
                <span th:if="${payment.status == 'REJECTED'}" class="badge badge-danger" th:text="${payment.status}"></span>
                <span th:if="${payment.status == 'FAILED'}" class="badge badge-danger" th:text="${payment.status}"></span>
                <span th:if="${payment.status == 'WAITING_PAYMENT'}" class="badge badge-warning" th:text="${payment.status}"></span>
            </p>
            
            <!-- Display payment data based on method -->
            <div th:if="${payment.method == 'VOUCHER'}">
                <p><strong>Voucher Code:</strong> <span th:text="${payment.paymentData.get('voucherCode')}"></span></p>
            </div>
            <div th:if="${payment.method == 'CASH_ON_DELIVERY'}">
                <p><strong>Delivery Address:</strong> <span th:text="${payment.paymentData.get('address')}"></span></p>
                <p><strong>Delivery Fee:</strong> <span th:text="${payment.paymentData.get('deliveryFee')}"></span></p>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">
            <h5>Order Details</h5>
        </div>
        <div class="card-body">
            <p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
            <p><strong>Customer:</strong> <span th:text="${order.author}"></span></p>
            <p><strong>Order Time:</strong> <span th:text="${#dates.format(new java.util.Date(order.orderTime * 1000), 'yyyy-MM-dd HH:mm:ss')}"></span></p>
            <p><strong>Order Status:</strong> 
                <span th:if="${order.status == 'SUCCESS'}" class="badge badge-success" th:text="${order.status}"></span>
                <span th:if="${order.status == 'FAILED'}" class="badge badge-danger" th:text="${order.status}"></span>
                <span th:if="${order.status == 'WAITING_PAYMENT'}" class="badge badge-warning" th:text="${order.status}"></span>
            </p>
            <p><strong>Products:</strong></p>
            <ul>
                <li th:each="product : ${order.products}">
                    <span th:text="${product.productName}"></span> 
                    (Quantity: <span th:text="${product.productQuantity}"></span>)
                </li>
            </ul>
        </div>
    </div>

    <div class="mt-4">
        <a th:href="@{/payment/detail}" class="btn btn-primary">Search Another Payment</a>
        <a th:href="@{/}" class="btn btn-secondary">Back to Home</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" 
        crossorigin="anonymous">
</script>

</body>
</html>
