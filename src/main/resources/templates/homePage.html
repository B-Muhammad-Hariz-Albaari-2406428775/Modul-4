<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>ADV Shop</title>
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container" style="text-align: center; margin-top: 50px">
      <h3>Welcome</h3>
      <p>Klik tombol di bawah untuk melihat daftar produk</p>

      <div class="row justify-content-center mt-4">
        <div class="col-md-8">
          <div class="card mb-3">
            <div class="card-header bg-primary text-white">
              <h5>Product Management</h5>
            </div>
            <div class="card-body">
              <a th:href="@{/product/list}" class="btn btn-primary btn-lg m-2"
                >Product List</a
              >
              <a
                th:href="@{/product/create}"
                class="btn btn-secondary btn-lg m-2"
                >Create Product</a
              >
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-header bg-success text-white">
              <h5>Order Management</h5>
            </div>
            <div class="card-body">
              <a th:href="@{/order/create}" class="btn btn-success btn-lg m-2"
                >Create Order</a
              >
              <a th:href="@{/order/history}" class="btn btn-info btn-lg m-2"
                >Order History</a
              >
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-header bg-warning text-dark">
              <h5>Payment Management</h5>
            </div>
            <div class="card-body">
              <a th:href="@{/payment/detail}" class="btn btn-warning btn-lg m-2"
                >Find Payment</a
              >
              <a
                th:href="@{/payment/admin/list}"
                class="btn btn-danger btn-lg m-2"
                >Admin - All Payments</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
