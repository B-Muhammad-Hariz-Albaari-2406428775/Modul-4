<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Find Payment</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>

<div class="container my-4">
    <h2 class="mb-4">Find Payment Details</h2>

    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/payment/detail}" method="post">
        <div class="form-group">
            <label for="paymentIdInput">Enter Payment ID</label>
            <input type="text" class="form-control mb-4 col-6" id="paymentIdInput" name="paymentId" 
                   placeholder="Enter payment ID to view details" required>
        </div>

        <button type="submit" class="btn btn-primary">View Payment Details</button>
        <a th:href="@{/}" class="btn btn-secondary">Back to Home</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" 
        crossorigin="anonymous">
</script>

</body>
</html>
